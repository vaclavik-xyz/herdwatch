name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and package versions
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path(".")
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          project = tomllib.loads((root / "pyproject.toml").read_text())
          plugin = tomllib.loads((root / "herdr-plugin.toml").read_text())
          package = (root / "src/herdwatch/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"$', package, re.MULTILINE)
          versions = {
              project["project"]["version"],
              plugin["version"],
              match.group(1) if match else "",
          }
          if versions != {expected}:
              raise SystemExit(
                  f"tag {expected!r} does not match package versions {sorted(versions)!r}"
              )
          PY
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/herdwatch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
