[project]
name = "herdwatch"
version = "0.2.1"
description = "Label herdr panes while their background work (CI, review, jobs) is still pending"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Filip Vaclavik" }]
keywords = ["ai-agents", "ci", "herdr", "herdeck", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/vaclavik-xyz/herdwatch"
Repository = "https://github.com/vaclavik-xyz/herdwatch"
Issues = "https://github.com/vaclavik-xyz/herdwatch/issues"

[project.scripts]
herdwatch = "herdwatch.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
